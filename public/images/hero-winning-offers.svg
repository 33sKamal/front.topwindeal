    <text x="28" y="110" font-family="Inter, sans-serif" font-size="56" font-weight="800" fill="#065f46">-90%</text>
    <text x="28" y="155" font-family="Inter, sans-serif" font-size="18" fill="#64748b">Today&apos;s top pick</text>
  </g>
