  </g>
  <g font-family="Inter, system-ui, sans-serif" fill="#ecfdf5">
    <text x="120" y="420" font-size="120" font-weight="800" opacity="0.95">Winning Offers</text>
    <text x="124" y="500" font-size="42" font-weight="500" opacity="0.85">Temu coupons - verified codes - up to 90% off</text>
    <text x="124" y="580" font-size="28" font-weight="600" fill="#a7f3d0">Flash sales - new user perks - free shipping deals</text>
  </g>
  <g transform="translate(1350 520)">
